<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mesa de Ayuda TI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Mesa de Ayuda TI</a>
      {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2 m-0">
        {% csrf_token %}
        <span class="text-white">Hola, {{ user.username }}</span>
        <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
      </form>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
